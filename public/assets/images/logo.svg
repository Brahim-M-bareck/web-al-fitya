<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a96e"/>
      <stop offset="100%" stop-color="#d4bc8a"/>
    </linearGradient>
  </defs>
  <!-- Outer octagon -->
  <polygon points="100,5 145,20 180,55 195,100 180,145 145,180 100,195 55,180 20,145 5,100 20,55 55,20"
           fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.6"/>
  <!-- 8-pointed star (two overlapping squares rotated 45°) -->
  <rect x="50" y="50" width="100" height="100" rx="2"
        fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.8"/>
  <rect x="50" y="50" width="100" height="100" rx="2"
        fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.8"
        transform="rotate(45 100 100)"/>
  <!-- Inner diamond -->
  <polygon points="100,60 140,100 100,140 60,100"
           fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.5"/>
  <!-- Center dot -->
  <circle cx="100" cy="100" r="4" fill="url(#gold)" opacity="0.7"/>
</svg>
