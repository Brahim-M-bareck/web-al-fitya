<footer id="contact" class="footer">
  <div class="footer__inner">
    <div class="footer__top">
      <div class="footer__brand">
        <img src="assets/images/Logo.png" alt="Al-Fitya" width="100" height="100">
      </div>

      <nav class="footer__nav" aria-label="Footer navigation">
        <a href="#about" (click)="scrollTo('about', $event)">{{ 'nav.about' | translate }}</a>
        <a href="#vision-mission" (click)="scrollTo('vision-mission', $event)">{{ 'nav.visionMission' | translate }}</a>
        <a href="#domains" (click)="scrollTo('domains', $event)">{{ 'nav.domains' | translate }}</a>
        <a href="#project" (click)="scrollTo('project', $event)">{{ 'nav.project' | translate }}</a>
        <a href="#values" (click)="scrollTo('values', $event)">{{ 'nav.values' | translate }}</a>
      </nav>

      <div class="footer__contact">
        <a class="footer__email" href="mailto:alfitiya.gourp@gmail.com">{{ 'footer.email' | translate }}</a>
        <p class="footer__social">{{ 'footer.socialPlaceholder' | translate }}</p>
        <div class="footer__social-links">
          <a href="#" aria-label="Twitter / X" class="footer__social-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
            </svg>
          </a>
          <a href="#" aria-label="Instagram" class="footer__social-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
              <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
              <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
            </svg>
          </a>
          <a href="#" aria-label="Telegram" class="footer__social-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
            </svg>
          </a>
        </div>
      </div>
    </div>

    <div class="footer__bottom">
      <p class="footer__copyright">{{ 'footer.copyright' | translate }}</p>
      <a class="footer__back-top" href="#" (click)="scrollToTop($event)" aria-label="Back to top">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 19V5M5 12l7-7 7 7"/>
        </svg>
      </a>
    </div>
  </div>
</footer>
