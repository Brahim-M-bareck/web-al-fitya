<section id="vision-mission" class="vm khatam-bg">
  <div class="vm__inner" appScrollReveal>
    <div class="vm__card vm__card--vision">
      <div class="vm__icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </div>
      <h2 class="vm__title">{{ 'vision.title' | translate }}</h2>
      <p class="vm__text section-text">{{ 'vision.content' | translate }}</p>
    </div>

    <div class="vm__divider" aria-hidden="true">
      <div class="vm__divider-line"></div>
      <div class="vm__divider-diamond"></div>
      <div class="vm__divider-line"></div>
    </div>

    <div class="vm__card vm__card--mission">
      <div class="vm__icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/>
          <path d="M2 12h20"/>
        </svg>
      </div>
      <h2 class="vm__title">{{ 'mission.title' | translate }}</h2>
      <p class="vm__text section-text">{{ 'mission.content' | translate }}</p>
    </div>
  </div>
</section>
