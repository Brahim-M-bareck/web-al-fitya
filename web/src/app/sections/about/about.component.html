<section id="about" class="about">
  <div class="about__inner">
    <div class="about__text" appScrollReveal>
      <span class="about__label">{{ 'about.title' | translate }}</span>
      <h2 class="about__title">{{ 'about.title' | translate }}</h2>
      <hr class="accent-divider" style="margin-left: 0;">
      <p class="about__content section-text">{{ 'about.content' | translate }}</p>
    </div>
    <div class="about__image-wrap" appScrollReveal>
      <div class="about__image-frame">
        <img src="assets/images/Logo.png" alt="logo" class="about__image">
      </div>
    </div>
  </div>
</section>
